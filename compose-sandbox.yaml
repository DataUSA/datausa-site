# Sandbox (sandbox.internal.datausa.io) on orion. Image built on the server by build.sh.
#
# The project name is pinned: the clone lives in a directory called datausa-site, and the
# production containers on orion already belong to a compose project with that name, so the
# default name would let `up --remove-orphans` / `down` touch production.
name: datausa-site-sandbox

services:
  datausa-site-sandbox:
    container_name: datausa-site-sandbox
    image: local/datausa-site:sandbox
    restart: always
    # pm2-runtime forwards SIGTERM to the workers; kill_timeout in ecosystem.config.cjs is 15s.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PM2_INSTANCES=${PM2_INSTANCES:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SANDBOX_PORT:-3054}:3301"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3301/robots.txt"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
